<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Players</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-6">Player Information</h1>
    <div th:if="${error}" class="text-red-500 mb-4 text-center">
        <span th:text="${error}"></span>
    </div>
    <div class="mb-4">
        <button th:onclick="|location.href='@{/api/team/{teamId}/players(sort=byName,teamId=${teamId})}'|" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 mr-2">Sort by Name</button>
        <button th:onclick="|location.href='@{/api/team/{teamId}/players(sort=byAge,teamId=${teamId})}'|" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Sort by Age</button>
    </div>
    <table class="w-full bg-white shadow-md rounded">
        <thead>
        <tr class="bg-gray-200">
            <th class="py-2 px-4">Name</th>
            <th class="py-2 px-4">Age</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="player : ${players}">
            <td class="py-2 px-4">
                <a th:href="@{/api/player/{playerId}/details(playerId=${player.id},teamId=${teamId})}" th:text="${player.info.name.full}" class="text-blue-500 hover:underline"></a>
            </td>
            <td class="py-2 px-4" th:text="${player.info.characteristics.age}"></td>
        </tr>
        <tr th:if="${players == null or players.empty}">
            <td colspan="2" class="py-2 px-4 text-center">No players available.</td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/api/team/{teamId}(teamId=${teamId})}" class="mt-4 inline-block bg-gray-500 text-white py-2 px-4 rounded hover:bg-gray-600">Back</a>
</div>
</body>
</html>
