<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Player Details</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-6">Player Details</h1>
    <div class="bg-white p-6 rounded shadow-md">
        <p class="text-lg"><strong>ID:</strong> <span th:text="${player.id}"></span></p>
        <p class="text-lg"><strong>Name:</strong> <span th:text="${player.info.name.full}"></span></p>
        <p class="text-lg"><strong>Age:</strong> <span th:text="${player.info.characteristics.age}"></span></p>
        <table class="w-full mt-4">
            <tr>
                <td class="py-2"><strong>Form:</strong> <span th:text="${player.info.skills.form}"></span></td>
                <td class="py-2"><strong>Tactical Discipline:</strong> <span th:text="${player.info.skills.tacticalDiscipline}"></span></td>
            </tr>
            <tr>
                <td class="py-2"><strong>Experience:</strong> <span th:text="${player.info.skills.experience}"></span></td>
                <td class="py-2"><strong>Teamwork:</strong> <span th:text="${player.info.skills.teamwork}"></span></td>
            </tr>
            <tr>
                <td class="py-2"><strong>Stamina:</strong> <span th:text="${player.info.skills.stamina}"></span></td>
                <td class="py-2"><strong>Goalkeeper:</strong> <span th:text="${player.info.skills.keeper}"></span></td>

            </tr>
            <tr>
                <td class="py-2"><strong>Pace:</strong> <span th:text="${player.info.skills.pace}"></span></td>
                <td class="py-2"><strong>Defender:</strong> <span th:text="${player.info.skills.defending}"></span></td>
            </tr>
            <tr>
                <td class="py-2"><strong>Technique:</strong> <span th:text="${player.info.skills.technique}"></span></td>
                <td class="py-2"><strong>Playmaking:</strong> <span th:text="${player.info.skills.playmaking}"></span></td>
            </tr>
            <tr>
                <td class="py-2"><strong>Passing:</strong> <span th:text="${player.info.skills.passing}"></span></td>
                <td class="py-2"><strong>Striker:</strong> <span th:text="${player.info.skills.striker}"></span></td>
            </tr>
        </table>
        <a th:href="@{/api/player/{playerId}/training(playerId=${player.id},teamId=${teamId})}" class="mt-4 inline-block bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Show Training Reports</a>
        <a th:href="@{/api/team/{teamId}/players(teamId=${teamId})}" class="mt-4 inline-block bg-gray-500 text-white py-2 px-4 rounded hover:bg-gray-600">Back</a>
    </div>
</div>
</body>
</html>
