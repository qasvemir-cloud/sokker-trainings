<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trening izveštaji</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-6">Trening izveštaji za igrača</h1>
    <table class="w-full bg-white shadow-md rounded">
        <thead>
        <tr class="bg-gray-200">
            <th class="py-2 px-4">Sezona</th>
            <th class="py-2 px-4">Sedmica</th>
            <th class="py-2 px-4">Tip treninga</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="report : ${reports}">
            <td class="py-2 px-4" th:text="${report.day.season}"></td>
            <td class="py-2 px-4" th:text="${report.day.seasonWeek}"></td>
            <td class="py-2 px-4">
                <a th:href="@{/api/player/{playerId}/training-details(playerId=${player.id},teamId=${teamId},season=${report.day.season},seasonWeek=${report.day.seasonWeek})}" th:text="${report.type.name}" class="text-blue-500 hover:underline"></a>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/api/player/{playerId}/details(playerId=${player.id},teamId=${teamId})}" class="mt-4 inline-block bg-gray-500 text-white py-2 px-4 rounded hover:bg-gray-600">Nazad</a>
</div>
</body>
</html>
